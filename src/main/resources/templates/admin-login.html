<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page admin-login-page">
<header>
    <div class="brand">
        <div class="header-title">관리자 로그인</div>
        <div class="header-sub">Admin</div>
    </div>
</header>

<main class="admin-login-main">
    <form id="admin-login-form" class="admin-login-form" autocomplete="off">
        <label for="login-id">아이디</label>
        <input type="text" id="login-id" placeholder="아이디" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호" required>

        <button type="submit">로그인</button>
        <p id="login-error" class="login-error" hidden></p>
    </form>
</main>

<script>
    const form = document.getElementById('admin-login-form');
    const errorBox = document.getElementById('login-error');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const loginId = document.getElementById('login-id').value.trim();
        const password = document.getElementById('password').value;

        const loginResponse = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
            body: JSON.stringify({loginId, password})
        });

        if (!loginResponse.ok) {
            showError('아이디 또는 비밀번호가 올바르지 않습니다.');
            return;
        }

        // 관리자/매니저만 관리자 페이지로 진입할 수 있다.
        const meResponse = await fetch('/me', {headers: {'Accept': 'application/json'}});
        const me = await meResponse.json();
        if (me.role === 'ADMIN' || me.role === 'MANAGER') {
            window.location.href = '/admin';
            return;
        }
        showError('관리자 권한이 없는 계정입니다.');
    });

    function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
    }
</script>
</body>
</html>
