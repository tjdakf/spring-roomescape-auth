<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page admin-home-page">
<header>
    <div class="brand">
        <div class="header-title">관리자 페이지</div>
        <div class="header-sub">Admin</div>
    </div>
    <div class="header-actions">
        <span class="header-welcome" id="header-welcome"></span>
        <button type="button" class="header-button" onclick="logout()">로그아웃</button>
        <a href="/" class="header-link">사용자 홈</a>
    </div>
</header>

<main class="admin-home-main">
    <div class="admin-home-heading">
        <div class="section-title">관리자 메뉴</div>
        <h1>운영 관리를 선택하세요</h1>
    </div>
    <div class="admin-home-actions">
        <a href="/admin/reservation">
            <span>예약 관리</span>
            <small>예약 조회, 등록, 삭제</small>
        </a>
        <a href="/admin/time">
            <span>시간 관리</span>
            <small>예약 시간 조회, 추가, 삭제</small>
        </a>
        <a href="/admin/theme">
            <span>테마 관리</span>
            <small>테마 조회, 추가, 삭제</small>
        </a>
        <a href="/admin/member">
            <span>회원 관리</span>
            <small>회원 조회, 매니저 승격</small>
        </a>
    </div>
</main>
<script>
    loadHeaderMember();

    function loadHeaderMember() {
        fetch('/me')
            .then(response => response.ok ? response.json() : null)
            .then(member => {
                if (!member) {
                    window.location.href = '/admin/login';
                    return;
                }
                document.getElementById('header-welcome').innerHTML = renderWelcome(member);
            })
            .catch(() => {
                window.location.href = '/admin/login';
            });
    }

    function renderWelcome(member) {
        const roleIcon = renderRoleIcon(member.role);
        return `${escapeHtml(member.name)}${roleIcon}님 환영합니다.`;
    }

    function renderRoleIcon(role) {
        if (role === 'ADMIN') {
            return '<span class="role-icon admin">관리자</span>';
        }
        if (role === 'MANAGER') {
            return '<span class="role-icon">매니저</span>';
        }
        return '';
    }

    function logout() {
        fetch('/logout', {method: 'POST'})
            .then(() => window.location.href = '/');
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
