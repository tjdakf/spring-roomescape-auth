<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
<header>
    <a href="/" class="escape-logo">ESC<span>A</span>PE</a>
    <a href="/reservation" class="header-link">예약하기</a>
</header>

<main class="login-main">
    <div class="login-panel">
        <div class="login-tabs">
            <button type="button" class="login-tab active" data-panel="login" onclick="showPanel('login')">로그인</button>
            <button type="button" class="login-tab" data-panel="signup" onclick="showPanel('signup')">회원가입</button>
        </div>

        <section class="login-section active" id="login-panel">
        <div class="section-header">
            <div class="section-title">Login</div>
        </div>
        <form id="login-form" class="login-form" autocomplete="off">
            <label for="login-id">아이디</label>
            <input type="text" id="login-id" placeholder="아이디" required>

            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" placeholder="비밀번호" required>

            <button type="submit">로그인</button>
            <p id="login-error" class="login-error" hidden></p>
        </form>
        </section>

        <section class="login-section" id="signup-panel">
        <div class="section-header">
            <div class="section-title">Sign Up</div>
        </div>
        <form id="signup-form" class="login-form" autocomplete="off">
            <label for="signup-login-id">아이디</label>
            <input type="text" id="signup-login-id" placeholder="아이디" required>

            <label for="signup-password">비밀번호</label>
            <input type="password" id="signup-password" placeholder="비밀번호" required>

            <label for="signup-name">이름</label>
            <input type="text" id="signup-name" placeholder="이름" required>

            <button type="submit">회원가입</button>
            <p id="signup-message" class="login-error" hidden></p>
        </form>
        </section>
    </div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const requestedRedirect = params.get('redirect') || '/';
    const redirect = requestedRedirect.startsWith('/') && !requestedRedirect.startsWith('//') ? requestedRedirect : '/';

    function showPanel(panel) {
        document.querySelectorAll('.login-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.panel === panel);
        });
        document.querySelectorAll('.login-section').forEach(section => {
            section.classList.toggle('active', section.id === `${panel}-panel`);
        });
    }

    document.getElementById('login-form').addEventListener('submit', async event => {
        event.preventDefault();
        const errorBox = document.getElementById('login-error');
        errorBox.hidden = true;

        const loginId = document.getElementById('login-id').value.trim();
        const password = document.getElementById('login-password').value;

        const response = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
            body: JSON.stringify({loginId, password})
        });

        if (response.ok) {
            window.location.href = redirect;
            return;
        }
        showMessage(errorBox, await readErrorMessage(response, '아이디 또는 비밀번호가 올바르지 않습니다.'));
    });

    document.getElementById('signup-form').addEventListener('submit', async event => {
        event.preventDefault();
        const messageBox = document.getElementById('signup-message');
        messageBox.hidden = true;

        const loginId = document.getElementById('signup-login-id').value.trim();
        const password = document.getElementById('signup-password').value;
        const name = document.getElementById('signup-name').value.trim();

        const response = await fetch('/members', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
            body: JSON.stringify({loginId, password, name})
        });

        if (response.ok) {
            document.getElementById('login-id').value = loginId;
            document.getElementById('login-password').focus();
            document.getElementById('signup-form').reset();
            showPanel('login');
            showMessage(document.getElementById('login-error'), '회원가입이 완료되었습니다. 비밀번호를 입력해 로그인하세요.', false);
            return;
        }
        showMessage(messageBox, await readErrorMessage(response, '회원가입을 처리하지 못했습니다.'));
    });

    async function readErrorMessage(response, fallback) {
        try {
            const error = await response.json();
            return error.detail || fallback;
        } catch (error) {
            return fallback;
        }
    }

    function showMessage(element, message, error = true) {
        element.textContent = message;
        element.classList.toggle('success', !error);
        element.hidden = false;
    }
</script>
</body>
</html>
